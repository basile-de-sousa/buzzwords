name: Random buzzword notification

on:
  # Runs every hour so that any local time in notify.config.json's `targets`
  # (SPEC-007 AC1) can be matched without editing this cron (SPEC-007 AC6).
  # `scripts/notify.mjs` computes the actual local time itself and sends
  # nothing outside a configured target (SPEC-004 AC1), so the other runs
  # each day are silent no-ops.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/notify.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
