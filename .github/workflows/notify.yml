name: Random buzzword notification

on:
  # Three runs a day: about 08:00, 13:00 and 19:00 Europe/Paris in summer,
  # one hour earlier in winter. Every run sends (SPEC-010 AC1, AC2); GitHub may
  # delay or skip a scheduled run under load, which is accepted.
  schedule:
    - cron: '0 6,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/notify.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
